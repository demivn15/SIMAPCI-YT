services:
  - type: web
    name: simapci-login-api
    runtime: python
    plan: free
    buildCommand: pip install -r app/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: LDAP_SERVER_URI
        sync: false
      - key: LDAP_BIND_DN
        sync: false
      - key: LDAP_BIND_PASSWORD
        sync: false
      - key: LDAP_USER_BASE_DN
        sync: false
      - key: LDAP_GROUP_BASE_DN
        sync: false
      - key: LDAP_PROFESSOR_GROUP_CN
        sync: false
