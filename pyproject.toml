[project]
name = "simapci-yt"
version = "0.1.0"
description = "Management System of Scientific Production at Yachay Tech"
readme = "README.md"
authors = [
    {name = "Demian Viter", email = "demivn15@gmail.com"},
    {name = "Alejandro Ortiz"},
    {name = "Jhony Peñaherrera"},
]
requires-python = ">=3.13"
dependencies = [
    "authlib>=1.8.0",
    "fastapi[standard]>=0.143.0",
    "httpx>=0.28.1",
    "passlib[bcrypt]>=1.7.4",
    "pydantic[email]>=2.14.0",
    "pymysql>=1.2.3",
    "python-dotenv>=1.2.4",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
