[pytest]
# Máxima verbosidad para el informe de pruebas de RED PAPERS:
#   -v   : nombre de cada test individual + resultado (PASSED/FAILED)
#   -s   : no captura stdout, por lo que cada print() se ve en vivo en consola
#   --tb=long : traceback completo si algo falla, útil para depurar en capturas
addopts = -v -s --tb=long --strict-markers
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S
