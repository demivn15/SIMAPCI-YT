version: '3.8'

services:
  ldap:
    image: rroemhild/test-openldap:latest
    container_name: mock_ldap_server
    ports:
      - "10389:10389" # Unsecured LDAP port
      - "10636:10636" # LDAPS (TLS) port
    restart: unless-stopped

  # Base de datos del backend (T-HU01-04). Credenciales solo para desarrollo local.
  mysql:
    image: mysql:8.0
    container_name: simapci_mysql
    environment:
      MYSQL_DATABASE: simapci
      MYSQL_USER: simapci
      MYSQL_PASSWORD: simapci
      MYSQL_ROOT_PASSWORD: simapci_root
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mysql_data:
